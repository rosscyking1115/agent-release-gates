[project]
name = "agent-release-gates"
version = "0.1.4"
description = "Release-readiness gates for AI agents: replay a pack of constructed safety scenarios, apply policy-as-code gates, and produce ship/warn/block evidence before an agent, prompt, model, or tool-policy change ships."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
keywords = [
    "ai-safety",
    "agent",
    "evaluation",
    "release-gate",
    "llm",
    "red-team",
    "inspect-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
# Lean core: the CLI release gate, the Inspect suite, the real-agent runner, and the
# eval/scoring logic need only pydantic. The API and dashboard are opt-in extras.
dependencies = [
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
# Run the FastAPI evidence service (uvicorn internal_ai_agent.api.main:app).
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
# Run the Streamlit reviewer dashboard from a source checkout.
dashboard = [
    "altair>=6.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.38.0",
]

[project.urls]
Homepage = "https://github.com/rosscyking1115/agent-release-gates"
Repository = "https://github.com/rosscyking1115/agent-release-gates"
Documentation = "https://rosscyking1115.github.io/agent-release-gates/"
Issues = "https://github.com/rosscyking1115/agent-release-gates/issues"

[project.scripts]
agent-safety = "internal_ai_agent.cli:main"

# Inspect (UK AISI) task discovery. `inspect_ai` is an optional peer dependency
# (pip install inspect_ai) so the deterministic core stays lean; once installed,
# `inspect eval incident_replay --model <provider/model>` runs. The task registers
# under its bare name, so a package-prefixed reference does not resolve.
[project.entry-points.inspect_ai]
agent_release_gates = "internal_ai_agent.inspect_suite._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internal_ai_agent"]

# The sdist contents are an ALLOWLIST, not an exclude list, and that is deliberate.
#
# Until 0.1.3 the sdist was whatever hatchling found in the working tree minus the
# repository's own .gitignore. Ignores that live in the *user's global* gitignore --
# `.claude/` and `graphify-out/` here -- are invisible to git status and invisible to
# the build backend, so local-only files were packaged and published. `.claude/
# settings.local.json` reached PyPI in 0.1.1 and 0.1.2 carrying machine paths and an
# unrelated local project name, and 0.1.3 would have added a 1 MB knowledge-graph cache
# full of absolute paths. PyPI releases cannot be unpublished.
#
# An exclude list only stops what you thought to name. An allowlist fails closed: a new
# local directory is absent from the sdist until someone adds it here on purpose.
# `tests/unit/test_sdist_contents.py` fails the build if this list ever admits one.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/data",
  "/config",
  "/schemas",
  "/examples",
  "/reports",
  "/ops",
  "/app",
  "/.github",
  "/.streamlit",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
  "/requirements.txt",
  "/runtime.txt",
  "/uv.lock",
  "/streamlit_app.py",
  "/Dockerfile",
  "/docker-compose.yml",
  "/.dockerignore",
  "/.gitattributes",
  "/.gitignore",
]

[dependency-groups]
# Dev/CI installs everything the test suite exercises (API + dashboard imports).
# `inspect-ai` is an optional peer dependency at runtime, but it is a dev dependency
# so CI actually executes tests/unit/test_inspect_suite.py instead of skipping it.
# Without it the Inspect task reference and scorer went unexercised in CI.
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.14",
    "inspect-ai>=0.3.100",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "altair>=6.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.38.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Deliberately scoped, and strict within that scope. Outside this list, repo-wide
# `--strict` still emits 403 errors across 38 files (74 in the package alone),
# overwhelmingly Any-leakage at JSON/IO boundaries. Counts re-measured 2026-07-27 after
# the gated modules were fixed; docs/typing_status.md carries the per-module breakdown.
# Gating all of that would mean either a wall of suppressions or
# a permissive config that passes without checking anything -- and a gate that checks
# nothing is worse than no gate, because it advertises a guarantee it does not provide.
#
# So this gates exactly the modules where a type error would corrupt a *published
# number*: the metric computation, the release-gate decision, the scorers that turn a
# model response into a verdict, and the report writer that renders those numbers.
# Everything else is unchecked and is not claimed to be checked -- see
# docs/typing_status.md for the full inventory and the ratchet order.
#
# This list ratchets UP only. Never delete a module from it to make CI pass: fix the
# type error, or the gate stops meaning anything.
files = [
    # Metric computation -- these produce the numbers that get published.
    "src/internal_ai_agent/evals/runner.py",
    "src/internal_ai_agent/evals/public_rag_findings.py",
    "src/internal_ai_agent/evals/techqa_public.py",
    "src/internal_ai_agent/evals/wixqa_public.py",
    # Release-gate decision -- these produce ship/warn/block and the safety figures.
    "src/internal_ai_agent/evals/gates.py",
    "src/internal_ai_agent/evals/safety_classifier.py",
    "src/internal_ai_agent/evals/incident_replay.py",
    # Response -> verdict scoring, including the Inspect path.
    "src/internal_ai_agent/inspect_suite/scoring.py",
    "src/internal_ai_agent/inspect_suite/scorers.py",
    "src/internal_ai_agent/providers/agent_runner.py",
    # Retrieval itself -- a type error here changes what gets scored.
    "src/internal_ai_agent/rag/baseline.py",
    # Renders every published metric into the committed report artifacts.
    "src/internal_ai_agent/reporting/public_report.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D2/D4 check the *shape* of docstrings that exist. D1 (missing-docstring) is
# deliberately not selected: this package has ~340 public callables and most are
# internal eval plumbing, so requiring a docstring everywhere would produce filler,
# and a docstring written to satisfy a linter is worse than none. Coverage is
# prioritised by hand -- see docs/house-style.md.
select = ["E", "F", "I", "UP", "B", "D2", "D4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
